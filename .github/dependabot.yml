version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # OkHttp 5.5.0 requires compileSdk 37; keep the available API 36 SDK.
    ignore:
      - dependency-name: com.squareup.okhttp3:*
        versions: ["5.5.0"]
    groups:
      android-media3:
        patterns:
          - androidx.media3:*
      kotlin:
        patterns:
          - org.jetbrains.kotlin:*
          - org.jetbrains.kotlin.*
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
